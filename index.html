us:6px;padding:12px;color:#17241e}input:focus{outline:2px solid #628347;outline-offset:2px}.unit{font-size:12px;color:#63715f;white-space:nowrap}.tariffs{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tariff{border:1px solid #dbe1d8;border-radius:8px;padding:18px}.tariff.alt{border-color:#a9c76b;background:#f9fdec}.tariff h3{font-size:15px;margin:0 0 20px}.tariff label{font-size:12px;display:block;margin:15px 0 8px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid #bfcbbc;background:transparent;border-radius:5px;padding:12px 15px;font-size:12px}.btn.primary{background:#17241e;color:var(--lime);border-color:#17241e}.result{background:#e4ff93;padding:35px;display:flex;flex-direction:column}.result .tag{color:#446126}.saving{font-size:clamp(50px,6vw,85px);font-weight:900;letter-spacing:-4px;margin:15px 0 5px}.result .helper{color:#405931}.comparison{margin-top:30px;display:grid;gap:20px}.row{display:flex;justify-content:space-between;gap:15px;font-size:13px}.row strong{font-size:18px}.bar{height:7px;background:#17241e20;border-radius:9px;margin-top:9px;overflow:hidden}.bar i{height:100%;display:block;background:#17241e;border-radius:9px;transition:width .3s}.bar.alt i{background:#668536}.formula{margin-top:30px;padding-top:20px;border-top:1px solid #17241e35;font-size:12px;line-height:1.8}.note{background:#ffffff50;padding:15px;margin-top:22px;border-radius:6px;font-size:12px;line-height:1.6}.error{color:#9b2e1e;font-size:13px;min-height:18px}.sections{padding:75px 5%}h2{font-size:clamp(30px,4vw,48px);letter-spacing:-2px;margin:10px 0 20px}.intro{max-width:670px;line-height:1.7;color:#607066}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:35px}.card{border-top:1px solid #bccbbb;padding-top:22px}.card h3{font-size:20px}.card p{color:#607066;line-height:1.7;font-size:14px}.dark{background:var(--bg);color:#f2f4ed;padding:70px 5%}.dark p{color:#b2c2b7;line-height:1.7;max-width:750px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:30px 0}.steps div{padding:20px;border:1px solid #ffffff25;border-radius:7px}.steps small{color:var(--lime);font:11px monospace}.steps p{font-size:13px}.next{padding:60px 5%;display:flex;justify-content:space-between;align-items:center;gap:25px}.next p{color:#607066;max-width:650px;line-height:1.7}footer{padding:25px 5%;border-top:1px solid #d4dcd1;display:flex;gap:25px;justify-content:space-between;font-size:11px;color:#607066}details{padding:15px 5%;font-size:12px;line-height:1.7;color:#607066}summary{cursor:pointer}.badge{display:inline-block;border:1px solid #6b7e69;border-radius:20px;padding:6px 10px;font:10px monospace;margin-bottom:12px}a:hover{text-decoration:underline}@media(max-width:800px){header{flex-wrap:wrap;gap:15px}nav{gap:12px}nav a{display:none}.hero{padding:45px 6% 85px}h1{letter-spacing:-3px}.workspace{grid-template-columns:1fr;margin-left:4%;margin-right:4%}.inputs,.result{padding:25px}.tariffs{gap:10px}.tariff{padding:12px}.cards{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.next{align-items:flex-start;flex-direction:column}footer{flex-wrap:wrap}.sections,.dark{padding:55px 6%}}@media(prefers-reduced-motion:reduce){.bar i{transition:none}}@media print{header,.hero,.controls,.sections,.dark,.next,footer,details{display:none}.workspace{margin:0;box-shadow:none}.result{background:#f0f0f0}.workspace{grid-template-columns:1fr 1fr}body{background:white}}
</style></head><body><header><a class="logo" href="#">GriD<span>calc</span><span style="font-size:18px"> ↗</span></a><nav><a href="#lab" data-de="Tarif-Labor" data-en="Tariff lab"></a><a href="#approach" data-de="Der Ansatz" data-en="The approach"></a><button class="lang" data-lang="de" aria-pressed="true">DE</button><button class="lang" data-lang="en" aria-pressed="false">EN</button></nav></header><main><section class="hero"><div class="tag">AISI GRID / ENERGY LAB</div><h1 data-de="Dein Strom.<br>Deine Zahlen.<br><em>Deine Entscheidung.</em>" data-en="Your energy.<br>Your numbers.<br><em>Your decision.</em>"></h1><p data-de="Was kostet dein Tarif wirklich? Vergleiche Jahreskosten mit deinen eigenen Daten. Transparent gerechnet – ohne versteckte Bonusversprechen." data-en="What does your tariff really cost? Compare annual costs using your own figures. Transparent calculations, without hidden bonus promises."></p><small data-de="Interaktiver Konzeptprototyp · Keine Live-Angebote · Kein Anbieterwechsel" data-en="Interactive concept prototype · No live offers · No supplier switching"></small></section><section class="workspace" id="lab" aria-label="Tarif-Labor / Tariff lab"><div class="inputs"><h2 class="sectiontitle" data-de="AISI Tarif-Labor" data-en="AISI tariff lab"></h2><p class="helper" data-de="Die Startwerte sind frei gewählte Beispiele. Ersetze sie durch vergleichbare Bruttopreise aus deinen Verträgen oder Angeboten." data-en="Starting figures are illustrative examples. Replace them with comparable tax-inclusive prices from your contracts or offers."></p><form id="form"><div class="consumption"><label for="kwh" data-de="Jahresverbrauch" data-en="Annual consumption"></label><div class="inputwrap"><input id="kwh" type="number" min="0" max="10000000" step="1" value="15000" required><span class="unit">kWh / <span data-de="Jahr" data-en="year"></span></span></div></div><div class="tariffs"><div class="tariff"><h3 data-de="01 / Aktueller Tarif" data-en="01 / Current tariff"></h3><label for="rateA" data-de="Arbeitspreis" data-en="Energy unit price"></label><div class="inputwrap"><input id="rateA" type="number" min="0" max="1000" step="0.01" value="24" required><span class="unit">ct/kWh</span></div><label for="baseA" data-de="Grundpreis pro Jahr" data-en="Annual standing charge"></label><div class="inputwrap"><input id="baseA" type="number" min="0" max="100000" step="0.01" value="180" required><span class="unit">€</span></div></div><div class="tariff alt"><h3 data-de="02 / Vergleichstarif" data-en="02 / Alternative tariff"></h3><label for="rateB" data-de="Arbeitspreis" data-en="Energy unit price"></label><div class="inputwrap"><input id="rateB" type="number" min="0" max="1000" step="0.01" value="21" required><span class="unit">ct/kWh</span></div><label for="baseB" data-de="Grundpreis pro Jahr" data-en="Annual standing charge"></label><div class="inputwrap"><input id="baseB" type="number" min="0" max="100000" step="0.01" value="150" required><span class="unit">€</span></div></div></div><div class="controls"><button class="btn primary" type="submit" data-de="Vergleich berechnen ↗" data-en="Calculate comparison ↗"></button><button class="btn" type="button" id="reset" data-de="Beispiel zurücksetzen" data-en="Reset example"></button><button class="btn" type="button" id="print" data-de="Drucken / PDF" data-en="Print / PDF"></button></div><p class="error" id="error" role="status"></p></form><p class="helper" data-de="Monatlicher Grundpreis? Multipliziere ihn mit 12. Dynamische Tarife lassen sich mit dieser Festpreisrechnung nicht verlässlich bewerten." data-en="Monthly standing charge? Multiply it by 12. This fixed-price calculation cannot reliably assess dynamic tariffs."></p></div><div class="result" aria-live="polite" aria-atomic="true"><div class="tag" id="resultLabel"></div><div class="saving" id="savings">480 €</div><p class="helper" id="resultText"></p><div class="comparison"><div><div class="row"><span data-de="Aktueller Tarif / Jahr" data-en="Current tariff / year"></span><strong id="current"></strong></div><div class="bar"><i id="barA"></i></div></div><div><div class="row"><span data-de="Vergleichstarif / Jahr" data-en="Alternative tariff / year"></span><strong id="alternative"></strong></div><div class="bar alt"><i id="barB"></i></div></div><div class="row"><span data-de="Differenz pro Monat" data-en="Monthly difference"></span><strong id="monthly"></strong></div></div><div class="formula"><strong data-de="Die Rechnung bleibt sichtbar." data-en="The calculation stays visible."></strong><div id="formulaA"></div><div id="formulaB"></div></div><div class="note" data-de="Modell: konstanter Verbrauch und Arbeitspreis über 12 Monate. Ohne Boni, zusätzliche Gebühren, Preisänderungen, Kündigungsfristen oder weitere Vertragsbedingungen. Das Ergebnis ist keine zugesicherte Ersparnis." data-en="Model: constant consumption and unit price over 12 months. Excludes bonuses, additional fees, price changes, notice periods and other contract terms. The result is not a guaranteed saving."></div></div></section><section class="sections" id="approach"><span class="badge" data-de="RECHNER HEUTE · AGENT ALS VISION" data-en="CALCULATOR TODAY · AGENT AS A VISION"></span><h2 data-de="Ein guter Preis ist erst der Anfang." data-en="A good price is just the beginning."></h2><p class="intro" data-de="GriDcalc ist der erste Baustein für einen Verbraucheragenten im AISI GRID. Heute rechnen wir mit deinen Eingaben. Perspektivisch sollen überprüfbare Angebotsdaten und Vertragsbedingungen gemeinsam bewertet werden." data-en="GriDcalc is the first building block for a consumer agent within AISI GRID. Today, it calculates using your inputs. In the future, verified offer data and contract conditions should be assessed together."></p><div class="cards"><article class="card"><div class="tag" style="color:#607b39">01 / COST</div><h3 data-de="Gesamtkosten verstehen" data-en="Understand total costs"></h3><p data-de="Arbeitspreis und Grundpreis gemeinsam betrachten. Ein niedriger Kilowattstundenpreis allein sagt noch nicht, welcher Vertrag günstiger ist." data-en="Consider unit prices and standing charges together. A low price per kilowatt-hour alone does not tell you which contract costs less."></p></article><article class="card"><div class="tag" style="color:#607b39">02 / CONTRACT</div><h3 data-de="Bedingungen prüfen" data-en="Check the conditions"></h3><p data-de="Geplant: Preisgarantie, Laufzeit, Kündigungsfrist, Bonusbedingungen und Anbieterinformationen nachvollziehbar einbeziehen. Diese Prüfung ist hier noch nicht implementiert." data-en="Planned: transparently incorporate price guarantees, duration, notice periods, bonus conditions and supplier information. This assessment is not implemented here yet."></p></article><article class="card"><div class="tag" style="color:#607b39">03 / CONTROL</div><h3 data-de="Du gibst den Auftrag" data-en="You set the mandate"></h3><p data-de="Ein Vergleich ist keine Wechselvollmacht. Ein künftiger Agent soll Entscheidungen vorbereiten und nur im ausdrücklich freigegebenen Umfang handeln." data-en="A comparison is not authority to switch suppliers. A future agent should prepare decisions and act only within an explicitly authorised scope."></p></article></div></section><section class="dark"><div class="tag">PROVENANCE / FROM CLAIM TO EVIDENCE</div><h2 data-de="Ersparnis muss belegbar sein." data-en="Savings should be verifiable."></h2><p data-de="Zielbild für den Agenten: jede Grundlage, Entscheidung und Freigabe nachvollziehen. Erst tatsächliche Rechnungen zeigen, ob eine prognostizierte Ersparnis eingetreten ist. Dieser Prototyp führt noch keine Provenance Chain." data-en="The goal for the agent: trace every source, decision and authorisation. Only actual bills show whether projected savings materialised. This prototype does not maintain a provenance chain yet."></p><div class="steps"><div><small>01 / SOURCE</small><p data-de="Alter Vertrag & Verbrauch" data-en="Existing contract & consumption"></p></div><div><small>02 / COMPARE</small><p data-de="Angebot & nachvollziehbarer Vergleich" data-en="Offer & transparent comparison"></p></div><div><small>03 / CONSENT</small><p data-de="Entscheidung & ausdrückliche Zustimmung" data-en="Decision & explicit authorisation"></p></div><div><small>04 / VERIFY</small><p data-de="Wechsel & tatsächliche Rechnungen" data-en="Switch & actual bills"></p></div></div><p data-de="Tarifwahl und Verbrauchssteuerung bleiben getrennte Funktionen. PV, Batterie, Wärmepumpe und E-Auto sind ein eigener späterer Optimierungspfad." data-en="Tariff selection and consumption control remain separate functions. Solar, batteries, heat pumps and electric vehicles form a separate future optimisation path."></p></section><section class="next"><div><h2 data-de="Deine Zahlen. Dein nächster Schritt." data-en="Your numbers. Your next step."></h2><p data-de="Du möchtest die Idee als Pilotnutzer oder Partner weiterentwickeln? Schreib uns. Aktuell gibt es keine Anmeldung, kein Abo und keinen automatischen Wechsel." data-en="Want to develop the idea as a pilot user or partner? Get in touch. There is currently no registration, subscription or automatic switching."></p></div><a class="btn primary" href="mailto:ceo@ailexsi.com?subject=GriDcalc" data-de="Kontakt aufnehmen ↗" data-en="Get in touch ↗"></a></section></main><footer><span>GriDcalc / AISI GRID / AILEXSI</span><span data-de="Lokale Berechnung · Keine Übermittlung deiner Tarifdaten" data-en="Local calculation · Your tariff inputs are not transmitted"></span><a href="https://we-are-the-grid.livelykoi1.chatgpt.site">WE ARE THE GRID ↗</a></footer><details><summary data-de="Projektvorschau & Datenschutz" data-en="Project preview & privacy"></summary><p data-de="Konzeptprototyp von Martin Gantert / AILEXSI. Kontakt: ceo@ailexsi.com. Eingaben werden im Browser verarbeitet und nicht gespeichert oder an einen Tarifdienst gesendet. Die Sprachwahl wird lokal gespeichert. Keine externen Analysewerkzeuge, Schriftarten oder Marketing-Cookies. Technisch erforderliche Hostingdaten können beim Hostingdienst anfallen. Vollständige Betreiberangaben und Hosting-Datenschutzinformationen sind vor einer öffentlichen Freigabe zu ergänzen." data-en="Concept prototype by Martin Gantert / AILEXSI. Contact: ceo@ailexsi.com. Inputs are processed in your browser and are not stored or sent to a tariff service. Language preference is stored locally. No external analytics, fonts or marketing cookies. The hosting service may process technically necessary access data. Complete operator details and hosting privacy information must be added before public release."></p></details><script src="calc.js"></script><script src="app.js"></script></body></html>
