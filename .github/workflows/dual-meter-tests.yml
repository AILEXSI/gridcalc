name: GridCalc dual-meter tests
on:
  push:
    branches: [main, feat/v0.2-dual-meter-case001]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check grid-engine.js
      - run: node --check grid-engine.test.js
      - run: node grid-engine.test.js
